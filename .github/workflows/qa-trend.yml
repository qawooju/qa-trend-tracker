name: QA Trend Tracker

on:
  schedule:
    # 03:00 KST 예약 — GitHub 예약 실행이 3~6시간 늦게 돈다(11/15~22 실측 02:17~04:53Z 시작).
    # 실제로는 06~09시 KST 쯤 돌아 11:00 적용 제안 실행보다 먼저 끝난다
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tracker
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C0AJZJLSXMH
        run: python tracker.py

      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add states/
          git diff --cached --quiet || git commit -m "Update tracker state [skip ci]"
          git pull --rebase
          git push
